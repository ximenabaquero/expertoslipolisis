<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Acceso Administrador | Expertos Lipólisis</title>
    <link rel="stylesheet" href="admin-style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="logo">
          <img src="logolipolisislaser.png" alt="Logo" class="logo-img" />
          <h1>expertoslipolisis</h1>
        </div>
      </div>
    </header>
    <section class="hero" style="padding: 150px 0">
      <div class="container">
        <div class="hero-content" style="text-align: center">
          <h2>Panel Administrativo</h2>
          <p>Acceso exclusivo para personal autorizado</p>

          <form
            id="adminLoginForm"
            style="max-width: 400px; margin: 40px auto; text-align: left"
          >
            <div class="form-group full">
              <label for="email">Correo electrónico</label>
              <input
                type="email"
                id="email"
                placeholder="admin@correo.com"
                required
              />
            </div>
            <div class="form-group full">
              <label for="password">Contraseña</label>
              <input
                type="password"
                id="password"
                placeholder="••••••••"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary btn-large">
              Ingresar
            </button>
            <p
              id="errorMsg"
              class="form-feedback error"
              style="display: none"
            ></p>
          </form>
        </div>
      </div>
    </section>
    <footer class="footer">
      <div class="footer-bottom">© 2025 Expertos Lipólisis</div>
    </footer>
    <script src="admin-login.js"></script>
  </body>
</html>
